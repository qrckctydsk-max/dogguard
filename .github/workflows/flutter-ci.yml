name: DogGuard Flutter CI

on:
  push:
    branches: ["main", "beta-rebuild"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  ios-simulator-build:
    name: Build iOS app (unsigned validation)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate native platform scaffolding
        run: flutter create --platforms=ios,android .

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    # Build independently so an Android debug artifact remains available for QA
    # even while widget tests are being repaired.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate native platform scaffolding
        run: flutter create --platforms=ios,android .

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dogguard-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
